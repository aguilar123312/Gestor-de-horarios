<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestor de Horarios</title>

    <link rel="stylesheet" href="Estilo menu.CSS">
</head>

<body>

    <!-- =====================================================
         CONTENEDOR PRINCIPAL
         ===================================================== -->

    <main class="contenido">

        <!-- =================================================
             DECORACIÓN SUPERIOR
             ================================================= -->

        <div class="decoracion-superior">

            <div class="capa-superior capa-1"></div>
            <div class="capa-superior capa-2"></div>
            <div class="capa-superior capa-3"></div>
            <div class="capa-superior capa-4"></div>

        </div>


        <!-- =================================================
             DECORACIÓN INFERIOR
             ================================================= -->

        <div class="decoracion-inferior">

            <div class="capa-inferior capa-1"></div>
            <div class="capa-inferior capa-2"></div>
            <div class="capa-inferior capa-3"></div>
            <div class="capa-inferior capa-4"></div>

        </div>


        <!-- =================================================
             CONTENIDO
             ================================================= -->

        <div class="contenido-central">


            <!-- ICONO SUPERIOR -->

            <div class="icono-titulo">

                <img
                    src="imagenes/horario.png"
                    alt="Calendario"
                >

            </div>


            <!-- TÍTULO -->

            <h1>GESTOR DE HORARIOS</h1>


            <!-- LÍNEAS DEL TÍTULO -->

            <div class="lineas-titulo">

                <span></span>
                <span></span>

            </div>


            <!-- SUBTÍTULO -->

            <h3>
                Institución Educativa Inocencio Chincá
            </h3>


            <!-- ESCUDO -->

            <img
                class="escudo"
                src="imagenes/escudo.png"
                alt="Escudo del colegio"
            >


            <!-- BOTONES -->

            <div class="botones">


                <!-- BOTÓN CREAR -->
                <a href="crear horario.html" style="text-decoration: none">
                <button
                    type="button"
                    class="boton-crear"
                >

                    <img
                        src="imagenes/horario.png"
                        alt="Calendario"
                    >

                    <span>
                        Crear horario
                    </span>

                </button>
                </a>


                <!-- BOTÓN VER -->
                <a href="ver horarios.html" style="text-decoration: none">
                <button
                    type="button"
                    class="boton-ver"
                >

                    <img
                        src="imagenes/menu.png"
                        alt="Menú"
                    >

                    <span>
                        Ver horarios creados
                    </span>

                </button>
                </a>
                

            </div>


        </div>

    </main>

</body>

</html>
